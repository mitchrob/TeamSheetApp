name: Back up production database

on:
  schedule:
    - cron: "47 4 * * *"
      timezone: "Europe/London"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_BACKUP_URL: ${{ vars.DATABASE_BACKUP_URL }}
      DATABASE_BACKUP_SECRET: ${{ secrets.DATABASE_BACKUP_SECRET }}
      DATABASE_BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.DATABASE_BACKUP_ENCRYPTION_PASSPHRASE }}
      DATABASE_BACKUP_OUTPUT: backup/teamsheet.db
      DATABASE_BACKUP_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.B2_REGION }}
      B2_BUCKET: ${{ vars.B2_BUCKET }}
      B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify snapshot
        run: python scripts/download_database_backup.py
      - name: Encrypt snapshot
        run: >-
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt
          -in backup/teamsheet.db
          -out backup/teamsheet.db.enc
          -pass env:DATABASE_BACKUP_ENCRYPTION_PASSPHRASE
      - name: Upload to Backblaze B2
        run: |
          object_name="teamsheet/$(date -u +%Y/%m)/teamsheet-$(date -u +%Y%m%d-%H%M%S).db.enc"
          aws s3 cp backup/teamsheet.db.enc "s3://${B2_BUCKET}/${object_name}" \
            --endpoint-url "${B2_ENDPOINT}" \
            --only-show-errors
      - name: Remove runner copies
        if: always()
        run: python -c "from pathlib import Path; [p.unlink(missing_ok=True) for p in (Path('backup/teamsheet.db'), Path('backup/teamsheet.db.enc'))]"
