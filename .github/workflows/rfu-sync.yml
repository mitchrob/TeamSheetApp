name: RFU fixture sync

on:
  schedule:
    - cron: "0 8 * * 0"
      timezone: "UTC"
  workflow_dispatch:
    inputs:
      season:
        description: "Optional RFU season in YYYY-YYYY format"
        required: false
        type: string
      dry_run:
        description: "Scrape and validate without submitting"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: rfu-fixture-sync
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      RFU_SEASON_INPUT: ${{ inputs.season }}
      RFU_DRY_RUN_INPUT: ${{ inputs.dry_run }}
      RFU_SYNC_SECRET: ${{ secrets.RFU_SYNC_SECRET }}
      RFU_SYNC_URL: ${{ vars.RFU_SYNC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install scraper
        run: python -m pip install -r requirements-scraper.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Scrape and submit fixtures
        shell: bash
        run: |
          args=(--diagnostics-dir diagnostics)
          if [[ -n "$RFU_SEASON_INPUT" ]]; then args+=(--season "$RFU_SEASON_INPUT"); fi
          if [[ "$RFU_DRY_RUN_INPUT" == "true" ]]; then args+=(--dry-run); fi
          python -m app.rfu_scraper "${args[@]}"
      - name: Upload scraper diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rfu-sync-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7
