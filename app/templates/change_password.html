{% extends 'base.html' %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="auth-card card"><div class="card-body"><h1 class="h2">Change your password</h1><p>Passwords must contain at least 12 characters.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label" for="current_password">Current password</label><input class="form-control mb-3" type="password" id="current_password" name="current_password" required autocomplete="current-password"><label class="form-label" for="new_password">New password</label><input class="form-control mb-3" type="password" id="new_password" name="new_password" minlength="12" required autocomplete="new-password"><label class="form-label" for="confirmation">Confirm new password</label><input class="form-control mb-3" type="password" id="confirmation" name="confirmation" minlength="12" required autocomplete="new-password"><button class="btn btn-primary" type="submit">Change password</button></form></div></div>
{% endblock %}
